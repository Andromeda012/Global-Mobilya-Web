*{margin:0;padding:0;box-sizing:border-box;}
:root{--navy:#2A2925;--navy2:#3F5443;--navy3:#5E7462;--gold:#C5A059;--white:#FFFFFF;--gray:#F7F5F0;--border:#E4DED3;--text:#2A2925;--muted:#656058;}
body{font-family:'Manrope','Open Sans',sans-serif;background:#F7F5F0;color:var(--text);}
a{text-decoration:none;color:inherit;}
img{max-width:100%;height:auto;display:block;}

.breadcrumb{background:var(--gray);padding:108px 40px 14px;font-size:12px;color:var(--muted);}
.breadcrumb a{color:var(--navy);font-weight:600;}
.breadcrumb span{margin:0 6px;color:var(--border);}

.page-hero{background:linear-gradient(135deg,#0B1B2E,#163352,#1D3E42);padding:50px 40px;text-align:center;color:var(--white);}
.page-hero h1{font-family:'Montserrat',sans-serif;font-size:34px;font-weight:800;margin-bottom:10px;}
.page-hero p{color:rgba(255,255,255,.7);font-size:14px;}

.blog-wrapper{max-width:1100px;margin:0 auto;padding:50px 40px;}
.blog-list{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.blog-card{background:var(--white);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;transition:all .2s;display:block;}
.blog-card:hover{box-shadow:0 6px 24px rgba(11,31,75,.1);transform:translateY(-3px);}
.blog-img{aspect-ratio:16/9;background:#f5f8fc;background-size:cover;background-position:center;border-bottom:1px solid var(--border);}
.blog-body{padding:18px;}
.blog-cat{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;font-family:'Montserrat',sans-serif;}
.blog-body h3{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;color:var(--navy);line-height:1.4;margin-bottom:8px;}
.blog-body p{font-size:12px;color:var(--muted);line-height:1.7;}
.blog-meta{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);font-weight:600;}

.empty{text-align:center;padding:60px 40px;color:var(--muted);}
.empty h3{color:var(--navy);font-size:20px;margin-bottom:10px;}
.loading{text-align:center;padding:60px 40px;color:var(--muted);}

footer{background:#060E22;padding:40px;color:rgba(255,255,255,.5);text-align:center;font-size:13px;}
footer a{color:var(--gold);}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/header.js"></script>
<script>
async function loadBlogs() {
  const container = document.getElementById('blog-container');
  const cacheBuster = '?t=' + Date.now();
  
  try {
    let posts = [];

    // 1. ÖNCE SUPABASE CLOUD DATABASE KONTROLÜ
    if (window.GKM_SUPABASE) {
      const sbBlogs = await window.GKM_SUPABASE.getBlogs();
      if (sbBlogs && sbBlogs.length > 0) {
        posts = sbBlogs;
      }
    }
    
    // 2. Fallback: Yerel blog dosyaları
    if (posts.length === 0) {
      let blogIds = [];
      try {
        const indexResponse = await fetch('_data/blog-index.json' + cacheBuster);
        if (indexResponse.ok) blogIds = await indexResponse.json();
      } catch(e) {}
      
      const blogPromises = blogIds.map(async (id) => {
        try {
          const r = await fetch(`_data/blog/${id}.json${cacheBuster}`);
          if (r.ok) {
            const data = await r.json();
            data.id = id;
            return data;
          }
        } catch(e) { return null; }
      });
      posts = (await Promise.all(blogPromises)).filter(p => p);
    }

    // Sadece mobilya içeriklerini listele (eski kapak/membran yazılarını hariç tut)
    posts = posts.filter(p => !/(membran|\bmdf\b|kapak\s*nedir|kapak\s*bakım)/i.test(`${p.title || ''} ${p.kategori || ''} ${p.ozet || ''}`));
    
    // Tarihe göre sırala
    posts.sort((a, b) => new Date(b.tarih || 0) - new Date(a.tarih || 0));
    
    if (posts.length === 0) {
      container.innerHTML = `<div class="empty"><h3>Henüz yazı yok</h3><p>Yakında yeni mobilya ve dekorasyon yazılarımız burada listelenecek.</p></div>`;
      return;
    }
    
    const html = `<div class="blog-list">${posts.map(p => {
      const tarih = p.tarih ? new Date(p.tarih).toLocaleDateString('tr-TR', {year:'numeric',month:'short',day:'numeric'}) : '';
      return `
        <a href="blog-yazi.html?id=${p.id}" class="blog-card hg-reveal">
          <div class="blog-img" style="background-image:url('${p.cover_image || p.resim || 'resim/showroom/warm_atelier.jpg'}');"></div>
          <div class="blog-body">
            <div class="blog-cat">${p.kategori || 'Mobilya Rehberi'}</div>
            <h3>${p.title}</h3>
            <p>${p.ozet || ''}</p>
            <div class="blog-meta"><span>📅 ${tarih}</span></div>
          </div>
        </a>
      `;
    }).join('')}</div>`;
    
    container.innerHTML = html;
    window.GKM_MOTION?.refreshReveals();
  } catch (err) {
    container.innerHTML = `<div class="empty"><h3>⚠️ Yükleme Hatası</h3></div>`;
  }
}

loadBlogs();
</script>
