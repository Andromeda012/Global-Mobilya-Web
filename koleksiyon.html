<!DOCTYPE html>
<html lang="tr" data-page="koleksiyon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koleksiyonlar | Global Mobilya — Mimari Mobilya Serileri</title>
<meta name="description" content="Global Mobilya koleksiyonları: Kahve Köşesi Koleksiyonları, Dolap Koleksiyonları ve Yatak Odası Koleksiyonları için kamera geçişli mimari sunum.">
<link rel="canonical" href="https://globalkapakmobilya.com/koleksiyon.html">
<link rel="icon" type="image/png" href="resim/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/luxury-atelier.css">
<link rel="stylesheet" href="css/showroom-motion.css">
<link rel="preload" as="image" href="/hero/bg.jpg">
<link rel="preload" as="image" href="/hero/bergamo-final.jpg">

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #14110E;
    color: #F7F5F0;
    font-family: var(--font-hg-sans);
  }

  /* Sürekli Kromatik Ortam Arka Planı */
  :root {
    --stage-accent: #E2B761;
  }

  #collectionCanvas {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #1D150F;
    overflow: hidden;
    pointer-events: none;
    transition: background-color 1.05s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .chroma-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.42;
    transition: background-color 1.05s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform, background-color;
  }
  .chroma-orb-a {
    width: min(68vw, 960px);
    height: min(68vw, 960px);
    top: -18vh;
    right: -14vw;
    background-color: #CC9C3C;
    animation: chromaDriftA 18s ease-in-out infinite alternate;
  }
  .chroma-orb-b {
    width: min(60vw, 840px);
    height: min(60vw, 840px);
    bottom: -22vh;
    left: -14vw;
    background-color: #7A5236;
    animation: chromaDriftB 22s ease-in-out infinite alternate;
  }
  .chroma-vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 28%, rgba(10, 8, 6, 0.58) 100%),
      linear-gradient(180deg, rgba(10, 8, 6, 0.25) 0%, rgba(10, 8, 6, 0.5) 100%);
  }

  @keyframes chromaDriftA {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(-6vw, 8vh, 0) scale(1.12); }
  }
  @keyframes chromaDriftB {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(7vw, -7vh, 0) scale(1.15); }
  }

  /* Kamera Sahne Taşıyıcı (%100 Viewport Tek Ekran Geçişleri) */
  .cam-deck {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 5;
  }
  .cam-track {
    width: 100%;
    will-change: transform;
    transition: transform 1.05s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cam-slide {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* ── SLIDE 0: KATEGORİ AÇILIŞ EKRANI ── */
  .cam-intro-slide {
    padding: clamp(92px, 12vh, 130px) clamp(20px, 5vw, 64px) clamp(28px, 4.5vh, 48px);
    text-align: center;
  }
  .cam-intro-center {
    max-width: 860px;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 2.2vh, 22px);
  }
  .cam-intro-kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 7px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(223, 199, 147, 0.34);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #DFC793;
    animation: introRise 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .cam-intro-title {
    font-family: var(--font-hg-serif);
    font-size: clamp(44px, 6.2vw, 88px);
    font-weight: 400;
    line-height: 1.0;
    color: #FFFFFF;
    margin: 0;
    animation: introRise 0.95s 0.08s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .cam-intro-title em {
    font-style: italic;
    color: #DFC793;
  }
  .cam-intro-desc {
    max-width: 660px;
    font-size: clamp(14px, 1.35vw, 17px);
    line-height: 1.65;
    color: rgba(247, 245, 240, 0.8);
    margin: 0;
    animation: introRise 1.05s 0.16s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .cam-intro-series-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
    animation: introRise 1.1s 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .cam-series-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.13);
    color: rgba(247, 245, 240, 0.86);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .cam-series-chip:hover {
    background: rgba(223, 199, 147, 0.16);
    border-color: #DFC793;
    color: #FFFFFF;
    transform: translateY(-2px);
  }
  .cam-series-chip span {
    font-size: 10px;
    color: #DFC793;
    font-weight: 700;
  }
  .cam-cat-switcher {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
    animation: introRise 1.1s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .cam-cat-btn {
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.04);
    color: rgba(247, 245, 240, 0.72);
    font-family: var(--font-hg-sans);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .cam-cat-btn:hover {
    border-color: rgba(223, 199, 147, 0.55);
    color: #FFFFFF;
  }
  .cam-cat-btn.active {
    background: rgba(223, 199, 147, 0.16);
    border-color: #DFC793;
    color: #DFC793;
  }
  .cam-intro-bottom {
    animation: introRise 1.15s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .cam-start-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    height: 52px;
    padding: 0 30px;
    border-radius: 999px;
    border: 1px solid rgba(223, 199, 147, 0.65);
    background: linear-gradient(135deg, rgba(223, 199, 147, 0.24) 0%, rgba(223, 199, 147, 0.1) 100%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #FFFFFF;
    font-family: var(--font-hg-sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 18px 42px -12px rgba(0, 0, 0, 0.7), 0 0 28px rgba(223, 199, 147, 0.16);
    transition: transform 0.32s var(--ease-hg), background 0.3s ease, box-shadow 0.3s ease;
  }
  .cam-start-btn:hover {
    transform: translateY(-3px);
    background: #DFC793;
    color: #16110D;
    box-shadow: 0 22px 48px -12px rgba(223, 199, 147, 0.45);
  }
  .cam-start-arrow {
    display: inline-block;
    animation: gentleBob 2s ease-in-out infinite;
  }

  @keyframes introRise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes gentleBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(4px); }
  }

  /* ── SLIDES 1..N: TEK EKRANDA KOLEKSİYON SUNUMU ── */
  .cam-col-slide {
    padding: clamp(12px, 1.8vh, 22px) clamp(18px, 3.2vw, 56px) clamp(12px, 1.8vh, 22px);
  }
  .cam-slide-shell {
    width: min(1240px, 100%);
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    gap: clamp(8px, 1.2vh, 14px);
  }

  /* Üst Kamera Butonu (Başa Dön) */
  .cam-top-nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .cam-nav-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(18, 14, 11, 0.68);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #F7F5F0;
    font-family: var(--font-hg-sans);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.26s var(--ease-hg);
  }
  .cam-nav-pill:hover {
    border-color: #DFC793;
    background: rgba(223, 199, 147, 0.16);
    color: #FFFFFF;
    transform: translateY(-2px);
  }
  .cam-nav-pill.primary {
    border-color: rgba(223, 199, 147, 0.55);
    background: rgba(223, 199, 147, 0.15);
    color: #DFC793;
  }
  .cam-nav-pill.primary:hover {
    background: #DFC793;
    color: #16110D;
  }
  .cam-slide-counter {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: rgba(247, 245, 240, 0.58);
  }

  /* Orta Alan: Başlık + Tanıtım + Sahne Birlikte %100 Ekrana Sığar */
  .cam-slide-core {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.3vh, 16px);
  }
  .cam-col-head {
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px 28px;
    flex-shrink: 0;
  }
  .cam-col-head-left {
    min-width: 0;
    flex: 1;
  }
  .stage-chapter {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--stage-accent);
    margin-bottom: 4px;
  }
  .stage-title {
    font-family: var(--font-hg-serif);
    font-size: clamp(26px, 3vw, 42px);
    font-weight: 400;
    line-height: 1.04;
    color: #fff;
    margin: 0 0 6px;
  }
  .stage-story {
    font-size: clamp(12.5px, 1.08vw, 14px);
    line-height: 1.5;
    max-width: 620px;
    color: rgba(247, 245, 240, 0.82);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cam-col-head-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }
  .stage-palettes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: flex-end;
  }
  .palette-chip {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .palette-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.45);
  }
  .stage-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .stage-actions .btn-hg-wipe {
    height: 38px;
    padding: 0 18px;
    font-size: 12px;
  }
  .btn-stage-secondary {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 38px;
    padding: 0 16px;
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    background: rgba(255, 255, 255, 0.06);
    color: #F7F5F0;
    font-family: var(--font-hg-sans);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s var(--ease-hg);
  }
  .btn-stage-secondary:hover {
    background: rgba(255, 255, 255, 0.16);
    border-color: var(--stage-accent);
  }

  /* Çerçeveli Sahne Kutusu — Viewport Yükseklik Matematiği (%100 Ölçekte Tam Sığma) */
  .cam-visual-frame-wrap {
    width: min(1160px, 100%, calc((100svh - 290px) * 1.7933));
    margin: 0 auto;
    flex-shrink: 0;
  }

  /* Etkileşimli Çok Katmanlı Showroom Çerçevesi */
  .scase-stage-shell {
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(223, 199, 147, 0.26);
    box-shadow: 0 28px 72px -20px rgba(0, 0, 0, 0.84);
    background: #140F0B;
  }
  .scase-stage {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #1A1511;
    isolation: isolate;
  }
  .scase-layer-bg {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }
  .scase-bg-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    user-select: none;
  }
  .scase-layer-modules {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  .scase-module-slot {
    position: absolute;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
    transform-origin: center bottom;
  }
  .scase-module-img {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    user-select: none;
    filter: drop-shadow(0 8px 16px rgba(12, 8, 4, 0.44));
  }
  .scase-master-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 36;
    pointer-events: none;
    user-select: none;
  }
  .scase-layer-hotspots {
    position: absolute;
    inset: 0;
    z-index: 42;
    pointer-events: none;
  }
  .scase-hotspot-zone {
    position: absolute;
    pointer-events: auto;
    cursor: pointer;
    border-radius: 6px;
    transition: background-color 0.25s ease;
  }
  .scase-hotspot-halo {
    position: absolute;
    inset: -3px;
    border-radius: 10px;
    border: 1.5px solid transparent;
    pointer-events: none;
    transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .scase-hotspot-zone.is-hovered .scase-hotspot-halo {
    border-color: rgba(223, 199, 147, 0.88);
    background: radial-gradient(circle at center, rgba(255, 224, 152, 0.13) 0%, rgba(223, 199, 147, 0.04) 72%, transparent 100%);
    box-shadow: 0 0 26px rgba(223, 199, 147, 0.4), inset 0 0 20px rgba(255, 224, 160, 0.16);
  }
  .scase-hotspot-zone.is-dimmed {
    background: rgba(12, 9, 6, 0.15);
  }
  .scase-contact-shadow {
    position: absolute;
    z-index: 1;
    pointer-events: none;
  }
  .scase-contact-module {
    bottom: -6px;
    left: 3%;
    right: 3%;
    height: 18px;
    background: radial-gradient(ellipse at center, rgba(10, 7, 4, 0.78) 0%, rgba(12, 8, 5, 0.42) 52%, transparent 80%);
    filter: blur(8px);
  }
  .scase-contact-decor {
    bottom: -4px;
    left: 4%;
    right: 4%;
    height: 22px;
    background: radial-gradient(ellipse at center, rgba(10, 7, 4, 0.72) 0%, rgba(12, 8, 5, 0.36) 54%, transparent 82%);
    filter: blur(10px);
  }
  .scase-tooltip {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    min-width: 168px;
    max-width: 220px;
    padding: 10px 13px;
    border-radius: 13px;
    background: rgba(18, 14, 10, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(223, 199, 147, 0.54);
    box-shadow: 0 18px 38px rgba(0, 0, 0, 0.72);
    color: #F7F5F0;
    text-align: center;
    z-index: 60;
    pointer-events: auto;
  }
  .scase-tooltip-eyebrow {
    display: block;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #DFC793;
    margin-bottom: 2px;
  }
  .scase-tooltip-title {
    display: block;
    font-family: var(--font-hg-serif);
    font-size: 18px;
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 3px;
    color: #FFFFFF;
  }
  .scase-tooltip-dim {
    display: block;
    font-size: 10px;
    color: rgba(247, 245, 240, 0.72);
    margin-bottom: 7px;
  }
  .scase-tooltip-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 11px;
    border-radius: 999px;
    background: #DFC793;
    color: #1A1510;
    font-size: 10.5px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .scase-tooltip-link:hover {
    background: #FFFFFF;
    transform: translateY(-1px);
  }
  .scase-layer-decors {
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
  }
  .scase-decor-slot {
    position: absolute;
    display: flex;
    align-items: flex-end;
    pointer-events: none;
  }
  .scase-decor-img {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
    display: block;
    user-select: none;
    filter: drop-shadow(0 14px 24px rgba(10, 7, 3, 0.56));
  }
  .scase-warm-blend {
    position: absolute;
    inset: 0;
    z-index: 34;
    pointer-events: none;
    background: radial-gradient(
      circle at 50% 42%,
      rgba(255, 232, 198, 0.12) 0%,
      rgba(212, 172, 124, 0.16) 60%,
      rgba(76, 52, 32, 0.2) 100%
    );
    mix-blend-mode: multiply;
  }
  .scase-dock-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 14px;
    padding: 10px 18px;
    background: rgba(18, 14, 10, 0.96);
    border-top: 1px solid rgba(223, 199, 147, 0.14);
  }
  .scase-dock-label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(247, 245, 240, 0.65);
  }
  .scase-dock-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .scase-dock-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #F7F5F0;
    text-decoration: none;
    font-size: 11.5px;
    transition: all 0.25s ease;
  }
  .scase-dock-pill strong {
    font-family: var(--font-hg-serif);
    font-size: 15px;
    font-weight: 400;
  }
  .scase-dock-pill span {
    font-size: 10.5px;
    color: rgba(247, 245, 240, 0.65);
  }
  .scase-dock-pill em {
    font-style: normal;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #DFC793;
  }
  .scase-dock-pill:hover,
  .scase-dock-pill.is-active {
    background: rgba(223, 199, 147, 0.15);
    border-color: #DFC793;
    transform: translateY(-1px);
  }

  /* Standart Koleksiyon Görseli için Tek Ekranlı Çerçeve */
  .cam-static-img-wrap {
    position: relative;
    aspect-ratio: 1024 / 571;
    width: 100%;
    overflow: hidden;
    cursor: zoom-in;
    background: #120F0C;
  }
  .cam-static-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.8s var(--ease-hg);
  }
  .cam-static-img-wrap:hover img {
    transform: scale(1.02);
  }

  /* Sağ Nokta Navigasyon Rayı */
  .col-index-nav {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 800;
    display: flex;
    flex-direction: column;
    gap: 13px;
    padding: 14px 9px;
    background: rgba(20, 17, 14, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 40px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .col-index-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.28);
    cursor: pointer;
    position: relative;
    transition: all 0.3s var(--ease-hg);
    border: none;
    padding: 0;
  }
  .col-index-dot.active {
    background: #DFC793;
    transform: scale(1.45);
    box-shadow: 0 0 12px rgba(223, 199, 147, 0.75);
  }
  .col-index-dot::before {
    content: attr(data-name);
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%) translateX(6px);
    background: rgba(20, 17, 14, 0.94);
    color: #fff;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.22s ease;
    border: 1px solid rgba(223, 199, 147, 0.28);
  }
  .col-index-dot:hover::before {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  /* Lightbox & Quote & 3D Modals */
  .col-lightbox {
    position: fixed;
    inset: 0;
    z-index: 1800;
    background: rgba(12, 10, 8, 0.92);
    backdrop-filter: blur(14px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }
  .col-lightbox.open { display: flex; }
  .col-lightbox-box { max-width: min(1240px, 94vw); text-align: center; }
  .col-lightbox-box img {
    max-width: 100%;
    max-height: 82vh;
    margin: 0 auto;
    object-fit: contain;
    border-radius: 16px;
    box-shadow: 0 32px 84px rgba(0, 0, 0, 0.8);
  }
  .col-lightbox-caption {
    margin-top: 14px;
    font-family: var(--font-hg-serif);
    font-size: 28px;
    color: #F7F5F0;
  }

  .quote-modal-wrap {
    position: fixed;
    inset: 0;
    z-index: 1600;
    background: rgba(14, 11, 9, 0.85);
    backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .quote-modal-wrap.open { display: flex; }
  .quote-modal {
    background: #1B1714;
    border: 1px solid rgba(223, 199, 147, 0.35);
    border-radius: 22px;
    width: min(560px, 100%);
    padding: 36px;
    position: relative;
    color: #fff;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
  }
  .quote-modal-close {
    position: absolute;
    top: 18px;
    right: 20px;
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.65);
    font-size: 24px;
    cursor: pointer;
  }
  .quote-modal-close:hover { color: #fff; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #DFC793;
    margin-bottom: 6px;
  }
  .form-group input, .form-group textarea {
    width: 100%;
    padding: 12px 15px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    color: #fff;
    font-family: var(--font-hg-sans);
    font-size: 14px;
    outline: none;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: #DFC793; }

  @media (max-width: 900px) {
    .cam-col-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .cam-col-head-right {
      align-items: flex-start;
    }
    .stage-palettes {
      justify-content: flex-start;
    }
    .cam-visual-frame-wrap {
      width: min(100%, calc((100svh - 335px) * 1.7933));
    }
  }

  @media (max-width: 640px) {
    .col-index-nav {
      right: 8px;
      padding: 10px 6px;
      gap: 9px;
    }
    .col-index-dot {
      width: 7px;
      height: 7px;
    }
    .cam-col-slide {
      padding: 10px 36px 12px 12px;
    }
    .cam-intro-slide {
      padding: 84px 18px 24px;
    }
    .stage-title {
      font-size: 25px;
      margin-bottom: 3px;
    }
    .stage-story {
      font-size: 12px;
      -webkit-line-clamp: 2;
    }
    .stage-palettes {
      display: none;
    }
    .cam-visual-frame-wrap {
      width: 100%;
    }
    .scase-dock-bar {
      padding: 8px 10px;
    }
    .scase-dock-label {
      display: none;
    }
    .scase-dock-pill {
      width: 100%;
      justify-content: space-between;
      padding: 5px 10px;
    }
    .scase-tooltip {
      min-width: 132px;
      max-width: 168px;
      padding: 7px 9px;
      border-radius: 10px;
    }
    .scase-tooltip-eyebrow { font-size: 7.5px; }
    .scase-tooltip-title { font-size: 13.5px; }
    .scase-tooltip-dim { display: none; }
    .scase-tooltip-link { font-size: 9.5px; padding: 3px 9px; }
  }
</style>
</head>

      <div id="refCodeDisplay" style="display:inline-block;padding:10px 22px;border-radius:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(223,199,147,0.4);font-weight:700;letter-spacing:0.12em;margin-bottom:22px;"></div>

<script>
const CATEGORIES = [
  'Kahve Köşesi Koleksiyonları',
  'Dolap Koleksiyonları',
  'Yatak Odası Koleksiyonları'
];

const CATEGORY_COPY = {
  'Kahve Köşesi Koleksiyonları': {
    kicker: 'Mimari Kahve Köşesi Vitrini',
    titleHtml: 'Kahve Köşesi <em>Koleksiyonları</em>',
    desc: 'Sıcak iç aydınlatmalı cam vitrinleri, barista ekipmanlarına özel geniş tezgâh açıklıkları ve 80 cm’den 160 cm’ye kadar uyarlanan modüler kahve köşesi serilerimizi sabit kamera geçişleriyle adım adım keşfedin.'
  },
  'Dolap Koleksiyonları': {
    kicker: 'Sistematik Depolama Mimarisi',
    titleHtml: 'Dolap <em>Koleksiyonları</em>',
    desc: 'Zeminden tavana milimetrik uyum sağlayan gövde birleşimleri, sessiz frenli donanımlar ve mekânın oranlarına göre şekillenen modüler dolap serilerimizi inceleyin.'
  },
  'Yatak Odası Koleksiyonları': {
    kicker: 'Özel Uyku &amp; Giyinme Kurguları',
    titleHtml: 'Yatak Odası <em>Koleksiyonları</em>',
    desc: 'Yatak odanızın ölçülerine ve doğal doku tercihlerinize özel tasarlanan gardırop, karyola ve komodin serilerimiz yakında bu kategoride vitrine çıkıyor.'
  }
};

const COLLECTION_ATMOSPHERES = {
  bergamo: {
    bg: [29, 21, 15], orb1: [204, 156, 60], orb2: [122, 82, 54],
    accent: '#E2B761', swatches: ['#543C24', '#8E765E', '#CC9C3C', '#E4DAD0']
  },
  lahey: {
    bg: [19, 27, 22], orb1: [109, 126, 94], orb2: [199, 174, 130],
    accent: '#C4D4A7', swatches: ['#6C6C54', '#84846C', '#CCB484', '#EFE9DF']
  },
  marsilya: {
    bg: [24, 23, 25], orb1: [130, 135, 116], orb2: [154, 96, 71],
    accent: '#DDBAA0', swatches: ['#6C543C', '#9C9C84', '#9C6C54', '#D6D3CE']
  },
  palermo: {
    bg: [31, 24, 19], orb1: [204, 132, 60], orb2: [196, 170, 146],
    accent: '#E7BE8A', swatches: ['#6C543C', '#B49C84', '#CC843C', '#E9DFD7']
  },
  toronto: {
    bg: [19, 22, 24], orb1: [111, 120, 126], orb2: [180, 132, 36],
    accent: '#D5BE8B', swatches: ['#543C3C', '#848484', '#B4B4B4', '#B48424']
  },
  troyes: {
    bg: [25, 18, 13], orb1: [156, 84, 36], orb2: [142, 106, 76],
    accent: '#E4A972', swatches: ['#3C2424', '#6C543C', '#9C5424', '#B48454']
  },
  bohem: {
    bg: [22, 19, 21], orb1: [108, 84, 84], orb2: [180, 156, 156],
    accent: '#D8C0B0', swatches: ['#242424', '#543C3C', '#6C5454', '#B49C9C']
  },
  fallback: {
    bg: [20, 17, 14], orb1: [94, 116, 98], orb2: [180, 140, 88],
    accent: '#DFC793', swatches: ['#3D352E', '#5E7462', '#C5A059', '#F0ECE4']
  }
};

let _allCollections = [];
let _visibleList = [];
let _activeCategory = 'Kahve Köşesi Koleksiyonları';
let _activeSlideIdx = 0;
let _sceneTriggerTimer = 0;

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

function getAtmosphere(slug) {
  const s = String(slug || '').toLowerCase();
  const key = Object.keys(COLLECTION_ATMOSPHERES).find(k => k !== 'fallback' && s.includes(k));
  return COLLECTION_ATMOSPHERES[key || 'fallback'];
}

function formatPieceTitle(p, collectionName) {
  const rawName = String(p.name || p.title || '').trim();
  const colName = String(collectionName || '').trim();
  const slug = String(p.slug || '').toLowerCase();

  if (rawName && rawName.toLowerCase() !== colName.toLowerCase()) {
    return rawName;
  }
  if (slug.includes('kucuk-kahve-kosesi')) return 'Küçük Boy Modül';
  if (slug.includes('orta-kahve-kosesi')) return 'Orta Boy Modül';
  if (slug.includes('buyuk-kahve-kosesi')) return 'Büyük Boy Modül';
  const doorMatch = slug.match(/(\d+)-kapili-dolap/);
  if (doorMatch) return `${doorMatch[1]} Kapılı Dolap Modülü`;
  return rawName || colName || 'Koleksiyon Parçası';
}

function openColLightbox(src, caption) {
  const modal = document.getElementById('colLightbox');
  document.getElementById('colLightboxImg').src = src;
  document.getElementById('colLightboxCap').textContent = caption || '';
  modal.classList.add('open');
}

function closeColLightbox() {
  document.getElementById('colLightbox').classList.remove('open');
}

function rgbStr(rgb) { return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`; }

function applySlideAtmosphere(slideIdx) {
  const canvas = document.getElementById('collectionCanvas');
  const orbA = document.getElementById('chromaOrbA');
  const orbB = document.getElementById('chromaOrbB');
  const slug = slideIdx === 0
    ? (_visibleList[0]?.slug || 'fallback')
    : (_visibleList[slideIdx - 1]?.slug || 'fallback');
  const atmo = getAtmosphere(slug);
  if (canvas) canvas.style.backgroundColor = rgbStr(atmo.bg);
  if (orbA) orbA.style.backgroundColor = rgbStr(atmo.orb1);
  if (orbB) orbB.style.backgroundColor = rgbStr(atmo.orb2);
  document.documentElement.style.setProperty('--stage-accent', atmo.accent);
}

function glideToSlide(targetIdx) {
  const maxSlide = _visibleList.length;
  const clamped = Math.max(0, Math.min(maxSlide, targetIdx));
  _activeSlideIdx = clamped;

  const track = document.getElementById('cameraTrack');
  if (track) {
    track.style.transform = `translate3d(0, -${clamped * 100}svh, 0)`;
  }

  document.querySelectorAll('#colIndexNav .col-index-dot').forEach((d, i) => {
    d.classList.toggle('active', i === clamped);
  });

  // İlk başlık ekranında üst bar görünür, koleksiyonları incelerken pürüzsüzce gizlenir
  window.GKM_HEADER?.setForceHidden(clamped > 0);
  applySlideAtmosphere(clamped);

  if (_sceneTriggerTimer) clearTimeout(_sceneTriggerTimer);
  const activeCol = clamped > 0 ? _visibleList[clamped - 1] : null;
  const activeSlug = activeCol ? String(activeCol.slug || '') : '';
  window.__GKM_ACTIVE_SCENE_SLUG = activeSlug;

  if (!activeSlug) {
    window.GKM_COLLECTION_STAGE?.activateSlide('');
    return;
  }

  // Kamera slaytı merkeze yaklaşırken (280ms) yavaş sahne girişini başlat
  _sceneTriggerTimer = setTimeout(() => {
    window.GKM_COLLECTION_STAGE?.activateSlide(activeSlug);
  }, 280);
}

function selectCategory(cat, initialSlideIdx = 0) {
  _activeCategory = CATEGORIES.includes(cat) ? cat : CATEGORIES[0];
  renderCategoryDeck(_activeCategory, initialSlideIdx);
}

function renderCategoryDeck(category, initialSlideIdx = 0) {
  const track = document.getElementById('cameraTrack');
  const nav = document.getElementById('colIndexNav');
  _visibleList = _allCollections.filter(c => c.category === category);

  const meta = CATEGORY_COPY[category] || CATEGORY_COPY[CATEGORIES[0]];

  // Sağ nokta rayı: Giriş + her koleksiyon noktası
  const dotNames = ['Kategori Özeti', ..._visibleList.map(c => c.name)];
  nav.innerHTML = dotNames.map((nm, idx) => `
    <button type="button" class="col-index-dot ${idx === 0 ? 'active' : ''}"
      data-name="${escHtml(nm)}"
      aria-label="${escHtml(nm)}"
      onclick="glideToSlide(${idx})">
    </button>
  `).join('');

  // Slide 0: Kategori Tanıtım & Başlangıç Ekranı
  const catSwitchHtml = CATEGORIES.map(catName => {
    const cnt = _allCollections.filter(c => c.category === catName).length;
    const isSel = catName === category;
    return `
      <button type="button" class="cam-cat-btn${isSel ? ' active' : ''}"
        onclick="selectCategory('${escHtml(catName)}', 0)">
        ${escHtml(catName)} (${cnt})
      </button>
    `;
  }).join('');

  const seriesPreviewHtml = _visibleList.length ? `
    <div class="cam-intro-series-list">
      ${_visibleList.map((c, idx) => `
        <button type="button" class="cam-series-chip" onclick="glideToSlide(${idx + 1})">
          <span>${String(idx + 1).padStart(2, '0')}</span> ${escHtml(c.name)}
        </button>
      `).join('')}
    </div>
  ` : '';

  const introCtaHtml = _visibleList.length
    ? `<button type="button" class="cam-start-btn" onclick="glideToSlide(1)">
         <span>Gezmeye Başla</span>
         <span class="cam-start-arrow">↓</span>
       </button>`
    : `<button type="button" class="cam-start-btn" onclick="openQuoteForCollection('${escHtml(category)} Özel Tasarım')">
         <span>✦ Özel Ölçü Teklifi İste</span>
         <span>→</span>
       </button>`;

  const slide0Html = `
    <section class="cam-slide cam-intro-slide" id="slide-intro">
      <div class="cam-intro-center">
        <span class="cam-intro-kicker">${meta.kicker}</span>
        <h1 class="cam-intro-title">${meta.titleHtml}</h1>
        <p class="cam-intro-desc">${escHtml(meta.desc)}</p>
        ${seriesPreviewHtml}
        <div class="cam-cat-switcher" role="tablist" aria-label="Koleksiyon Kategorisi Seçimi">
          ${catSwitchHtml}
        </div>
      </div>
      <div class="cam-intro-bottom">
        ${introCtaHtml}
      </div>
    </section>
  `;

  // Slides 1..N: Her Koleksiyon Tek Ekranda (%100 Ölçekte Scroll Olmadan Sığar)
  const colSlidesHtml = _visibleList.map((c, idx) => {
    const slideNum = idx + 1;
    const hasNext = slideNum < _visibleList.length;
    const nextCol = hasNext ? _visibleList[idx + 1] : null;
    const atmo = getAtmosphere(c.slug);
    const dbPalettes = Array.isArray(c.color_palette) && c.color_palette.length ? c.color_palette : atmo.swatches;
    const pieces = Array.isArray(c.pieces) ? c.pieces : [];
    const heroUrl = c.hero_image_url || 'resim/showroom/warm_atelier.jpg';

    const hasInteractiveScene = Boolean(
      window.GKM_COLLECTION_STAGE?.resolveScene?.(c) ||
      window.GKM_HERO_CONFIG?.resolveCollectionSceneConfig?.(c) ||
      c.scene_config ||
      /bergamo/i.test(String(c.slug || c.name || ''))
    );

    const paletteHtml = dbPalettes.slice(0, 4).map(hex => `
      <span class="palette-chip" title="Seri Renk Tonu: ${escHtml(hex)}">
        <span class="palette-dot" style="background:${escHtml(hex)}"></span>${escHtml(hex)}
      </span>
    `).join('');

    const visualBlockHtml = hasInteractiveScene
      ? `
        <div data-collection-scene="${escHtml(c.slug)}">
          <div class="scase-stage-shell">
            <div class="scase-stage" style="aspect-ratio:1024/571;">
              <img src="${escHtml(heroUrl)}" alt="${escHtml(c.name)}" style="width:100%;height:100%;object-fit:cover;display:block;">
            </div>
          </div>
        </div>
      `
      : `
        <div class="scase-stage-shell">
          <div class="cam-static-img-wrap" onclick="openColLightbox('${escHtml(heroUrl)}', '${escHtml(c.name)}')">
            <img src="${escHtml(heroUrl)}" alt="${escHtml(c.name)}" loading="lazy" onerror="this.src='resim/showroom/warm_atelier.jpg'">
          </div>
          ${pieces.length ? `
            <div class="scase-dock-bar">
              <span class="scase-dock-label">Seri Modülleri (${pieces.length} Parça):</span>
              <div class="scase-dock-pills">
                ${pieces.map(p => {
                  const pTitle = formatPieceTitle(p, c.name);
                  const pDim = p.dimensions || p.olcu || '';
                  return `
                    <a href="urun.html?id=${encodeURIComponent(p.slug)}" class="scase-dock-pill">
                      <strong>${escHtml(pTitle)}</strong>
                      ${pDim ? `<span>${escHtml(pDim)}</span>` : ''}
                      <em>Detaya Git →</em>
                    </a>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;

    return `
      <section class="cam-slide cam-col-slide" id="stage-${escHtml(c.slug)}" data-slug="${escHtml(c.slug)}">
        <div class="cam-slide-shell">
          <div class="cam-top-nav">
            <button type="button" class="cam-nav-pill" onclick="glideToSlide(0)">↑ Başa Dön</button>
            <span class="cam-slide-counter">SERİ ${String(slideNum).padStart(2, '0')} / ${String(_visibleList.length).padStart(2, '0')}</span>
            ${slideNum > 1
              ? `<button type="button" class="cam-nav-pill" onclick="glideToSlide(${slideNum - 1})">← Önceki</button>`
              : ''}
          </div>

          <div class="cam-slide-core">
            <div class="cam-col-head">
              <div class="cam-col-head-left">
                <span class="stage-chapter">${escHtml(c.category)}</span>
                <h2 class="stage-title">${escHtml(c.name)}</h2>
                <p class="stage-story">${escHtml(c.design_story || '')}</p>
              </div>
              <div class="cam-col-head-right">
                ${paletteHtml ? `<div class="stage-palettes">${paletteHtml}</div>` : ''}
                <div class="stage-actions">
                  <button type="button" class="btn-hg-wipe" onclick="openQuoteForCollection('${escHtml(c.name)}')">
                    <span class="btn-hg-wipe-inner">
                      <span class="btn-hg-wipe-row main">✦ Teklif İste</span>
                      <span class="btn-hg-wipe-row clone" aria-hidden="true">✦ Teklif İste</span>
                    </span>
                  </button>
                  ${c.model_3d_url ? `
                    <button type="button" class="btn-stage-secondary" onclick="openCollection3DModal('${escHtml(c.name)}', '${escHtml(c.model_3d_url)}')">
                      3D / AR
                    </button>` : ''}
                  <a href="galeri.html" class="btn-stage-secondary">Galeri Vitrini</a>
                </div>
              </div>
            </div>

            <div class="cam-visual-frame-wrap">
              ${visualBlockHtml}
            </div>
          </div>

          <div class="cam-top-nav">
            ${hasNext
              ? `<button type="button" class="cam-nav-pill primary" onclick="glideToSlide(${slideNum + 1})">Diğer Koleksiyon: ${escHtml(nextCol.name)} ↓</button>`
              : `<button type="button" class="cam-nav-pill primary" onclick="glideToSlide(0)">↑ Kategori Başlangıcına Dön</button>`}
          </div>
        </div>
      </section>
    `;
  }).join('');

  track.innerHTML = slide0Html + colSlidesHtml;

  window.__GKM_COLLECTIONS_CACHE = _visibleList;
  const activeCol = initialSlideIdx > 0 ? _visibleList[initialSlideIdx - 1] : null;
  window.__GKM_ACTIVE_SCENE_SLUG = activeCol ? String(activeCol.slug || '') : '';
  window.GKM_COLLECTION_STAGE?.mountAll(_visibleList, window.__GKM_ACTIVE_SCENE_SLUG);

  glideToSlide(initialSlideIdx);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeColLightbox();
    closeQuoteModal();
    closeCol3dModal();
  }
});

function openQuoteForCollection(colName) {
  const modal = document.getElementById('quoteModal');
  document.getElementById('quoteModalTitle').textContent = `${colName} — Özel Teklif`;
  document.getElementById('q_model').value = colName;
  document.getElementById('quoteFormWrap').style.display = 'block';
  document.getElementById('quoteSuccess').style.display = 'none';
  modal.classList.add('open');
}

function closeQuoteModal() {
  document.getElementById('quoteModal').classList.remove('open');
}

function openCollection3DModal(name, modelUrl) {
  const modal = document.getElementById('col3dModal');
  document.getElementById('col3dTitle').textContent = `${name} — 3D / AR İnceleme`;
  document.getElementById('col3dMount').innerHTML = `
    <model-viewer src="${escHtml(modelUrl)}" alt="${escHtml(name)}" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate shadow-intensity="1" style="width:100%;height:100%;"></model-viewer>
  `;
  modal.classList.add('open');
}

function closeCol3dModal() {
  document.getElementById('col3dModal').classList.remove('open');
  document.getElementById('col3dMount').innerHTML = '';
}

async function submitCollectionQuote(e) {
  e.preventDefault();
  const btn = document.getElementById('btnQuoteSubmit');
  const orig = btn.innerHTML;
  btn.disabled = true;

  const model = document.getElementById('q_model').value;
  const name = document.getElementById('q_name').value.trim();
  const phone = document.getElementById('q_phone').value.trim();
  const city = document.getElementById('q_city').value.trim();
  const notes = document.getElementById('q_notes').value.trim();

  try {
    let res = null;
    if (window.GKM_SUPABASE && window.GKM_SUPABASE.createQuoteRequest) {
      res = await window.GKM_SUPABASE.createQuoteRequest({
        name, phone, city,
        collection_id: model,
        notes: `Koleksiyon: ${model} | Notlar: ${notes}`
      });
    }
    const ref = res?.reference_code || ('GM-2026-' + Math.floor(1000 + Math.random() * 9000));
    document.getElementById('refCodeDisplay').textContent = ref;
    const waMsg = `Merhaba Global Mobilya, ${ref} referans kodu ile "${model}" için teklif talebi bıraktım. Adım: ${name} (${phone}${city ? ' - ' + city : ''}). Not: ${notes}`;
    document.getElementById('successWaBtn').href = `https://wa.me/905050151035?text=${encodeURIComponent(waMsg)}`;
    document.getElementById('quoteFormWrap').style.display = 'none';
    document.getElementById('quoteSuccess').style.display = 'block';
  } catch (err) {
    alert('Hata: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

async function initCollectionsPage() {
  try {
    _allCollections = window.GKM_SUPABASE ? await window.GKM_SUPABASE.getCollections() : [];
  } catch (e) {
    _allCollections = [];
  }

  const params = new URLSearchParams(window.location.search);
  const paramCat = params.get('kategori');
  const paramSlug = params.get('id');

  if (paramSlug) {
    const matchedCol = _allCollections.find(c => String(c.slug || '') === paramSlug);
    if (matchedCol) {
      const catCols = _allCollections.filter(c => c.category === matchedCol.category);
      const slideOffset = catCols.findIndex(c => c.slug === matchedCol.slug) + 1;
      selectCategory(matchedCol.category, Math.max(1, slideOffset));
      return;
    }
  }

  if (paramCat) {
    const matchedCat = CATEGORIES.find(c => c.toLowerCase() === paramCat.toLowerCase());
    selectCategory(matchedCat || CATEGORIES[0], 0);
    return;
  }

  selectCategory(CATEGORIES[0], 0);
}

document.addEventListener('DOMContentLoaded', initCollectionsPage);
</script>
