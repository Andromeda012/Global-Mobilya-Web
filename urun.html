<!DOCTYPE html>
<html lang="tr" data-page="urun">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Global Kapak Mobilya ürün detayları, teknik özellikleri, malzeme bilgisi ve sipariş detayları.">
<title>Ürün Detayı | Global Kapak Mobilya</title>
<link rel="icon" type="image/png" sizes="32x32" href="/resim/logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="/resim/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="/resim/logo.png">
<link rel="shortcut icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0F253E;
  --navy2:#1E3F66;
  --navy3:#2E6F9E;
  --gold:#D4AF37;
  --gold-dark:#B8860B;
  --accent:#3B82A6;
  --sage:#4A7862;
  --white:#FFFFFF;
  --gray:#F4F7F9;
  --gray2:#E9EFF5;
  --border:#DCE5ED;
  --text:#1E293B;
  --muted:#5B6B7C;
}
body{font-family:'Open Sans',sans-serif;color:var(--text);background:#FAFBFD;}
a{text-decoration:none;color:inherit;}
img{max-width:100%;height:auto;display:block;}

/* NAVBAR */
nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:65px;position:sticky;top:0;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.06);gap:8px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0;}
.nav-logo img{height:48px;width:auto;}
.nav-menu{display:flex;gap:0;align-items:center;flex:1;justify-content:center;}
.nav-menu a{font-size:11.5px;font-weight:600;color:var(--navy);padding:6px 10px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
.nav-menu a:hover,.nav-menu a.active{background:var(--navy) !important;color:#fff !important;}
.nav-cta{background:var(--accent);color:var(--white);font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:4px;font-family:'Montserrat',sans-serif;white-space:nowrap;}
.hamburger{display:none;background:none;border:none;font-size:24px;cursor:pointer;color:var(--navy);}

/* BREADCRUMB */
.breadcrumb{background:var(--gray);border-bottom:1px solid var(--border);padding:12px 40px;font-size:12px;color:var(--muted);}
.breadcrumb a{color:var(--navy3);font-weight:600;}
.breadcrumb span{margin:0 6px;color:var(--border);}
.loading{text-align:center;padding:90px 40px;color:var(--muted);font-size:15px;font-weight:600;}

/* ÜRÜN DETAY ANA WRAPPER */
.pd-wrapper{
  max-width:1240px;
  margin:0 auto;
  padding:40px 40px 70px;
  display:grid;
  grid-template-columns:1fr 1.15fr;
  gap:50px;
  align-items:start;
}

/* SOL KOLON: GÖRSEL GALERİ */
.pd-gallery{position:sticky;top:95px;align-self:start;}
.pd-main-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 14px 38px rgba(15,37,62,0.06);
  position:relative;
}
.pd-img-container{
  width:100%;
  aspect-ratio:1/1;
  background:radial-gradient(circle at 50% 40%, #FFFFFF 0%, #EEF4F8 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  position:relative;
  cursor:pointer;
}
.pd-img-container img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  transition:transform .3s ease;
}
.pd-img-container:hover img{
  transform:scale(1.03);
}

/* Fotoğraf Rozetleri */
.pd-floating-badge{
  position:absolute;
  top:16px;
  left:16px;
  display:flex;
  gap:8px;
  z-index:2;
  flex-wrap:wrap;
}
.badge-pill{
  background:rgba(15,37,62,0.9);
  color:#fff;
  border:1px solid rgba(255,255,255,0.25);
  padding:5px 12px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  backdrop-filter:blur(6px);
  letter-spacing:0.3px;
}
.badge-pill.gold{
  background:linear-gradient(135deg, #1E3F66 0%, #0F253E 100%);
  border-color:rgba(212,175,55,0.6);
  color:#FDE68A;
}

.pd-zoom-btn{
  position:absolute;
  bottom:16px;
  right:16px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(15,37,62,0.85);
  color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  cursor:pointer;
  transition:all .2s ease;
  z-index:2;
}
.pd-zoom-btn:hover{
  background:var(--navy);
  transform:scale(1.1);
}

.pd-thumbs{
  display:flex;
  gap:12px;
  margin-top:16px;
  flex-wrap:wrap;
}
.pd-thumb{
  width:78px;
  height:78px;
  border-radius:12px;
  border:2px solid var(--border);
  overflow:hidden;
  cursor:pointer;
  transition:all .2s;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px;
}
.pd-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.pd-thumb:hover,.pd-thumb.active{
  border-color:var(--navy3);
  box-shadow:0 4px 12px rgba(46,111,158,0.2);
}

/* Sol Kolon Alt Hızlı Güvence Rozetleri */
.pd-gallery-perks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.perk-box{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  font-weight:700;
  color:var(--navy);
}
.perk-box span{font-size:18px;}

/* SAĞ KOLON: ÜRÜN BİLGİLERİ */
.pd-info{display:flex;flex-direction:column;gap:18px;}

.pd-cat-badge{
  display:inline-block;
  align-self:flex-start;
  font-family:'Montserrat',sans-serif;
  font-size:11px;
  font-weight:800;
  color:var(--navy3);
  background:rgba(46,111,158,0.1);
  border:1px solid rgba(46,111,158,0.25);
  padding:5px 12px;
  border-radius:6px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.pd-title{
  font-family:'Montserrat',sans-serif;
  font-size:32px;
  font-weight:900;
  color:var(--navy);
  line-height:1.2;
}

.pd-meta-bar{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  font-size:12.5px;
  color:var(--muted);
}
.pd-sku-tag{
  background:var(--gray);
  border:1px solid var(--border);
  border-radius:6px;
  padding:4px 10px;
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  color:var(--navy);
}
.pd-rating-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#B45309;
  font-weight:700;
}

.pd-short-desc{
  font-size:14.5px;
  line-height:1.8;
  color:#334155;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 22px;
  border-left:4px solid var(--navy3);
}

/* BİLGİ KARTLARI (ÖZELLİKLER, RENKLER, ÖLÇÜLER) */
.info-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  box-shadow:0 4px 16px rgba(15,37,62,0.03);
}
.info-card-header{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Montserrat',sans-serif;
  font-size:13px;
  font-weight:800;
  color:var(--navy);
  text-transform:uppercase;
  letter-spacing:0.6px;
  border-bottom:1px solid var(--border);
  padding-bottom:12px;
  margin-bottom:16px;
}

/* Teknik Özellikler Listesi */
.specs-list{
  list-style:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.specs-list li{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  color:var(--text);
  background:var(--gray);
  border:1px solid #E2E8F0;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
}
.specs-list li span.spec-icon{
  font-size:16px;
  flex-shrink:0;
}

/* Renk Kartları */
.color-badges-grid{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.color-badge-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--gray);
  border:1.5px solid var(--border);
  border-radius:30px;
  padding:8px 16px;
  font-size:12.5px;
  font-weight:700;
  color:var(--navy);
}
.color-badge-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,0.25);
  display:inline-block;
}

/* Ölçü & Boyut Tablosu */
.dims-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.dims-table th, .dims-table td{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
.dims-table th{
  background:var(--gray);
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  color:var(--navy);
  width:38%;
}
.dims-table td{
  font-weight:600;
  color:var(--text);
}
.dims-note{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
  font-style:italic;
}

/* SİPARİŞ & TEKLİF BUTONLARI */
.pd-actions-row{
  display:flex;
  gap:14px;
  align-items:center;
  margin-top:8px;
  flex-wrap:wrap;
}
.btn-whatsapp-order{
  flex:1.4;
  min-width:240px;
  background:linear-gradient(135deg, #10B981 0%, #059669 100%);
  color:#FFFFFF;
  padding:16px 24px;
  border-radius:12px;
  font-family:'Montserrat',sans-serif;
  font-size:14px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 22px rgba(16,185,129,0.3);
  transition:all .2s ease;
  border:none;
  cursor:pointer;
}
.btn-whatsapp-order:hover{
  background:linear-gradient(135deg, #059669 0%, #047857 100%);
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(16,185,129,0.4);
}
.btn-inquiry-form{
  flex:0.8;
  min-width:160px;
  background:transparent;
  border:2px solid var(--navy);
  color:var(--navy);
  padding:15px 20px;
  border-radius:12px;
  font-family:'Montserrat',sans-serif;
  font-size:13.5px;
  font-weight:700;
  text-align:center;
  transition:all .2s ease;
}
.btn-inquiry-form:hover{
  background:var(--navy);
  color:#fff;
}

/* 3'LÜ GÜVENCE BİLGİ BANDI */
.pd-trust-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:14px;
  margin-top:10px;
}
.trust-item{
  background:var(--gray);
  border:1px solid #E2E8F0;
  border-radius:12px;
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.trust-item strong{
  font-family:'Montserrat',sans-serif;
  font-size:12px;
  font-weight:800;
  color:var(--navy);
}
.trust-item span{
  font-size:11.5px;
  color:var(--muted);
  line-height:1.5;
}

/* ALT BÖLÜM: AYRINTILI AÇIKLAMA */
.pd-details-section{
  max-width:1240px;
  margin:0 auto 60px;
  padding:0 40px;
}
.pd-body-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  padding:36px;
  box-shadow:0 4px 20px rgba(15,37,62,0.03);
  line-height:1.9;
  font-size:14.5px;
  color:#334155;
}
.pd-body-card h2, .pd-body-card h3{
  font-family:'Montserrat',sans-serif;
  color:var(--navy);
  margin-bottom:14px;
  margin-top:20px;
}
.pd-body-card p{margin-bottom:14px;}
.pd-body-card ul{margin-left:20px;margin-bottom:14px;}

/* LIGHTBOX */
.lb-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);align-items:center;justify-content:center;}
.lb-overlay.open{display:flex;}
.lb-img-wrap{position:relative;max-width:90vw;max-height:90vh;display:flex;align-items:center;justify-content:center;}
.lb-img-wrap img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;}
.lb-close{position:fixed;top:20px;right:24px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lb-prev,.lb-next{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lb-prev{left:16px;}.lb-next{right:16px;}
.lb-counter{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:13px;font-family:'Montserrat',sans-serif;}
.error{text-align:center;padding:90px 40px;}
.error h2{color:var(--navy);font-family:'Montserrat',sans-serif;margin-bottom:14px;}

@media(max-width:1024px){
  .pd-wrapper{grid-template-columns:1fr;padding:24px;gap:32px;}
  .pd-gallery{position:static;}
  .pd-details-section{padding:0 24px;}
  .specs-list{grid-template-columns:1fr;}
}
@media(max-width:768px){
  nav{padding:0 16px;}
  .nav-menu{display:none;position:absolute;top:65px;left:0;right:0;background:var(--white);flex-direction:column;padding:14px 16px;border-bottom:1px solid var(--border);}
  .nav-menu.open{display:flex;}
  .hamburger{display:block;}
  .nav-cta{display:none;}
  .pd-title{font-size:25px;}
  .pd-trust-row{grid-template-columns:1fr;}
  .pd-gallery-perks{grid-template-columns:1fr;}
}
</style>
</head>

  </div>

</nav>

<div class="breadcrumb">
  <a href="index.html">Anasayfa</a><span>›</span>
  <a href="urunler.html">Ürünlerimiz</a><span>›</span>
  <span id="bc-category">Koleksiyon</span><span>›</span>

</div>

<div id="product-container">
  <div class="loading">⏳ Ürün detayları veritabanından yükleniyor...</div>
</div>

<!-- LIGHTBOX -->
<div class="lb-overlay" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <div class="lb-img-wrap"><img id="lb-img" src="" alt=""></div>
  <button class="lb-next" onclick="lbNav(1)">&#8250;</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script src="js/supabase-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const productId = (params.get('id') || params.get('slug') || '').trim();
let galleryImages = [];
let lbIndex = 0;
let currentProductTitle = 'Mobilya & Membran Kapak Modeli';

function selectThumb(index) {
  const mainImg = document.getElementById('main-product-img');
  if (mainImg) mainImg.src = galleryImages[index];
  document.querySelectorAll('.pd-thumb').forEach((t, i) => t.classList.toggle('active', i === index));
}

function openLightbox(index) {
  lbIndex = index;
  updateLb();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function lbNav(dir) {
  lbIndex = (lbIndex + dir + galleryImages.length) % galleryImages.length;
  updateLb();
}
function updateLb() {
  document.getElementById('lb-img').src = galleryImages[lbIndex];
  document.getElementById('lb-counter').textContent = (lbIndex + 1) + ' / ' + galleryImages.length;
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'Escape') closeLightbox();
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});

// Renk kodları için hafif renk tonu belirleme
function getColorSwatch(colorName) {
  const c = (colorName || '').toLowerCase();
  if (c.includes('mavi') || c.includes('fjord')) return '#3B6E96';
  if (c.includes('yeşil') || c.includes('yesil') || c.includes('adaçayı')) return '#4A7862';
  if (c.includes('gri') || c.includes('kuvars')) return '#64748B';
  if (c.includes('antrasit') || c.includes('siyah')) return '#1E293B';
  if (c.includes('meşe') || c.includes('ceviz') || c.includes('ahşap')) return '#8B5A2B';
  if (c.includes('krem') || c.includes('bej') || c.includes('kaşmir')) return '#D2C2AC';
  if (c.includes('beyaz')) return '#F8FAFC';
  return '#3B82A6';
}

async function loadProduct() {
  const container = document.getElementById('product-container');
  if (!productId) {
    container.innerHTML = '<div class="error"><h2>Ürün Belirtilmedi</h2><p><a href="urunler.html">← Ürünler Kataloğuna Dön</a></p></div>';
    return;
  }
  const cacheBuster = '?t=' + Date.now();
  let p = null;

  // 1. SUPABASE CLOUD DATABASE
  if (window.GKM_SUPABASE) {
    try {
      p = await window.GKM_SUPABASE.getProductBySlug(productId);
    } catch (e) {}
  }

  // 2. FALLBACK YEREL JSON
  if (!p) {
    try {
      let r = await fetch(`_data/urunler/${productId}.json${cacheBuster}`);
      if (!r.ok) r = await fetch(`/_data/urunler/${productId}.json${cacheBuster}`);
      if (r.ok) p = await r.json();
    } catch (e) {}
  }

  if (!p) {
    container.innerHTML = '<div class="error"><h2>Ürün Bulunamadı</h2><p>Aradığınız ürün yayından kaldırılmış veya güncelleniyor olabilir.</p><p><a href="urunler.html" style="color:var(--navy3); font-weight:700; text-decoration:underline;">← Tüm Ürünlere Dön</a></p></div>';
    return;
  }

  const pTitle = p.title || p.baslik || 'Özel Tasarım Mobilya & Kapak';
  currentProductTitle = pTitle;
  const pCat = p.kategori || p.category || '1. Sınıf MDF • CNC Membran Kapak';
  const pSku = p.sku ? p.sku.trim() : '';
  const pDesc = p.kisa_aciklama || p.aciklama || 'Modern CNC teknolojisi ve 1. sınıf 18mm E1 MDF gövde kalitesiyle mekanınıza özel olarak üretilmektedir.';

  document.title = `${pTitle} | Global Kapak Mobilya`;
  const bcProduct = document.getElementById('bc-product');
  const bcCat = document.getElementById('bc-category');
  if (bcProduct) bcProduct.textContent = pTitle;
  if (bcCat) bcCat.textContent = pCat;

  // Görselleri derle
  let imgs = [];
  if (Array.isArray(p.gorseller) && p.gorseller.length) imgs = imgs.concat(p.gorseller);
  if (Array.isArray(p.galeri) && p.galeri.length) imgs = imgs.concat(p.galeri);
  if (p.resim && !imgs.includes(p.resim)) imgs.unshift(p.resim);
  if (p.ana_resim && !imgs.includes(p.ana_resim)) imgs.unshift(p.ana_resim);
  if (imgs.length === 0) imgs = ['resim/logo.png'];
  galleryImages = imgs.map(u => (window.GKM_SUPABASE ? window.GKM_SUPABASE.normalizeMediaUrl(u, 'resim/logo.png') : u));

  const thumbHtml = galleryImages.length > 1
    ? '<div class="pd-thumbs">' + galleryImages.map((src, i) =>
        `<div class="pd-thumb${i === 0 ? ' active' : ''}" onclick="selectThumb(${i})"><img src="${src}" alt="Görsel ${i + 1}" loading="lazy"></div>`
      ).join('') + '</div>'
    : '';

  // Özellikler Listesi (Database p.ozellikler)
  let rawSpecs = [];
  if (Array.isArray(p.ozellikler) && p.ozellikler.length > 0) {
    rawSpecs = p.ozellikler;
  } else if (typeof p.ozellikler === 'string' && p.ozellikler.trim()) {
    try {
      const parsed = JSON.parse(p.ozellikler);
      if (Array.isArray(parsed)) rawSpecs = parsed;
    } catch (_) {
      rawSpecs = p.ozellikler.split(',').map(s => s.trim()).filter(Boolean);
    }
  }

  if (rawSpecs.length === 0) {
    rawSpecs = [
      '1. Sınıf 18mm E1 Sertifikalı Sağlam MDF Gövde',
      'Çizilmeye & Yüksek Neme Dayanıklı İthal Membran',
      'Özel Ölçüye Göre 0.01 mm 5-Eksen CNC Profilleme',
      'Frenli Sessiz Kapanan Ray & Menteşe Donanım Uyumu',
      '5 Yıl Fabrika Üretici Garantisi',
      '5 İş Günü İçerisinde Türkiye Geneli Hızlı Sevkiyat'
    ];
  }

  const specsListHtml = rawSpecs.map(s => {
    let text = String(s).trim();
    let icon = '🪵';
    if (text.includes('Membran') || text.includes('Kapak') || text.includes('Çizil')) icon = '🪞';
    if (text.includes('CNC') || text.includes('İşleme') || text.includes('Profil')) icon = '⚙️';
    if (text.includes('Garanti') || text.includes('Yıl')) icon = '🛡️';
    if (text.includes('Sevkiyat') || text.includes('Teslimat') || text.includes('Gün')) icon = '🚚';
    if (text.includes('Ray') || text.includes('Menteşe') || text.includes('Fren')) icon = '🗄️';
    if (text.includes('Ölçü') || text.includes('cm') || text.includes('Ebat')) icon = '📐';
    if (text.includes('Renk') || text.includes('Kartela')) icon = '🎨';
    return `<li><span class="spec-icon">${icon}</span> <span>${text}</span></li>`;
  }).join('');

  // Renkler Listesi (Database p.renkler)
  let rawColors = [];
  if (Array.isArray(p.renkler) && p.renkler.length > 0) {
    rawColors = p.renkler;
  } else if (typeof p.renkler === 'string' && p.renkler.trim()) {
    try {
      const parsed = JSON.parse(p.renkler);
      if (Array.isArray(parsed)) rawColors = parsed;
    } catch (_) {
      rawColors = p.renkler.split(',').map(s => s.trim()).filter(Boolean);
    }
  }

  let colorSectionHtml = '';
  if (rawColors.length > 0) {
    const colorPills = rawColors.map(c => `
      <div class="color-badge-pill">
        <span class="color-badge-dot" style="background:${getColorSwatch(c)};"></span>
        <span>${c}</span>
      </div>
    `).join('');

    colorSectionHtml = `
      <div class="info-card">
        <div class="info-card-header">
          <span>🎨</span> MEVCUT RENK & YÜZEY SEÇENEKLERİ
        </div>
        <div class="color-badges-grid">
          ${colorPills}
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--muted);">
          * Projenize özel 50+ kartela rengi ve mat/ipek doku alternatifleri uygulanabilmektedir.
        </div>
      </div>
    `;
  }

  // Ölçüler (Database p.olculer veya p.dimensions)
  let dimsHtml = '';
  const rawDims = p.olculer || p.dimensions;
  if (rawDims) {
    if (typeof rawDims === 'object' && rawDims !== null) {
      dimsHtml = Object.entries(rawDims).map(([k, v]) => `
        <tr>
          <th>${capitalizeWord(k.replace(/_/g, ' '))}:</th>
          <td>${v}</td>
        </tr>
      `).join('');
    } else if (typeof rawDims === 'string' && rawDims.trim()) {
      dimsHtml = `
        <tr>
          <th>Katalog Ölçüleri:</th>
          <td>${rawDims}</td>
        </tr>
      `;
    }
  }

  if (!dimsHtml) {
    dimsHtml = `
      <tr>
        <th>Standart Kapak Ölçüleri:</th>
        <td>40×72 cm • 45×72 cm • 60×72 cm • 45×90 cm • 60×140 cm • 60×210 cm</td>
      </tr>
      <tr>
        <th>Özel Ölçü İmalat:</th>
        <td>Mekanınıza ve projenize uygun milimetrik CNC kesim imkanı</td>
      </tr>
    `;
  }

  // WhatsApp Mesajı
  const waMessage = `Merhaba Global Kapak Mobilya, "${pTitle}"${pSku ? ` (Ürün Kodu: ${pSku})` : ''} modeli hakkında detaylı bilgi, katalog ve güncel fiyat teklifi almak istiyorum.`;
  const waUrl = `https://wa.me/905050151035?text=${encodeURIComponent(waMessage)}`;

  // Detaylı Açıklama (Database p.body)
  const bodyContent = p.body ? simpleMarkdown(p.body) : '';

  container.innerHTML = `
    <div class="pd-wrapper">
      <!-- SOL: GÖRSEL & GALERİ -->
      <div class="pd-gallery">
        <div class="pd-main-card">
          <div class="pd-floating-badge">
            <span class="badge-pill gold">🛡️ 5 Yıl Üretici Garantisi</span>
            <span class="badge-pill">🪵 1. Sınıf E1 MDF</span>
          </div>
          <div class="pd-img-container" onclick="openLightbox(0)" title="Görseli büyütmek için tıklayın">
            <img id="main-product-img" src="${galleryImages[0]}" alt="${pTitle}">
            <div class="pd-zoom-btn" title="Tam Ekran Büyüt">🔍</div>
          </div>
        </div>
        ${thumbHtml}

        <div class="pd-gallery-perks">
          <div class="perk-box"><span>🪵</span> 18mm E1 Dayanıklı MDF</div>
          <div class="perk-box"><span>🪞</span> Çizilmez Membran Kapak</div>
          <div class="perk-box"><span>🏭</span> Doğrudan Fabrika İmalatı</div>
          <div class="perk-box"><span>🚚</span> 5 İş Günü Hızlı Sevkiyat</div>
        </div>
      </div>

      <!-- SAĞ: DETAYLI ÜRÜN BİLGİLERİ -->
      <div class="pd-info">
        <div class="pd-cat-badge">${pCat}</div>
        <h1 class="pd-title">${pTitle}</h1>

        <div class="pd-meta-bar">
          ${pSku ? `<div class="pd-sku-tag">Ürün Kodu: <strong>${pSku}</strong></div>` : ''}
          <div class="pd-rating-tag">★★★★★ <span>5.0 (Fabrika Standartları)</span></div>
          <div style="color:var(--muted);">• İstanbul Bağcılar Üretim Tesisimiz</div>
        </div>

        <div class="pd-short-desc">${pDesc}</div>

        <!-- 1. TEKNİK ÖZELLİKLER KARTI -->
        <div class="info-card">
          <div class="info-card-header">
            <span>📌</span> TEKNİK VE MALZEME ÖZELLİKLERİ
          </div>
          <ul class="specs-list">
            ${specsListHtml}
          </ul>
        </div>

        <!-- 2. RENK SEÇENEKLERİ KARTI (Varsa) -->
        ${colorSectionHtml}

        <!-- 3. ÖLÇÜ & EBAT BİLGİSİ -->
        <div class="info-card">
          <div class="info-card-header">
            <span>📐</span> ÖLÇÜ VE İMALAT STANDARTLARI
          </div>
          <table class="dims-table">
            <tbody>
              ${dimsHtml}
            </tbody>
          </table>
          <div class="dims-note">
            💡 Mimari projeleriniz veya ev yenilemeleriniz için istediğiniz en ve boy ölçüsünde özel üretim yapılmaktadır.
          </div>
        </div>

        <!-- SİPARİŞ & TEKLİF BUTONLARI -->
        <div class="pd-actions-row">
          <a href="${waUrl}" target="_blank" class="btn-whatsapp-order">
            💬 WhatsApp ile Fiyat & Sipariş Bilgisi Al
          </a>
          <a href="iletisim.html" class="btn-inquiry-form">
            ✉️ Teklif Formu
          </a>
        </div>

        <!-- 3'LÜ KURUMSAL GÜVENCE BANDI -->
        <div class="pd-trust-row">
          <div class="trust-item">
            <strong>🪵 1. Kalite Malzeme</strong>
            <span>E1 Avrupa normlarına uygun, kanserojen madde içermeyen gövde.</span>
          </div>
          <div class="trust-item">
            <strong>🛡️ 5 Yıl Garanti</strong>
            <span>Soyulma, kabarma ve renk solmalarına karşı tam üretici garantisi.</span>
          </div>
          <div class="trust-item">
            <strong>🚚 5 Günde Sevkiyat</strong>
            <span>İstanbul içi ve Türkiye geneli güvenli ambalajlı sevkiyat.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- DETAYLI METİN & KULLANIM ALANLARI (Body) -->
    ${bodyContent ? `
      <div class="pd-details-section">
        <div class="pd-body-card">
          <div class="info-card-header" style="margin-bottom:20px;">
            <span>📖</span> DETAYLI ÜRÜN AÇIKLAMASI & KULLANIM ALANLARI
          </div>
          <div>${bodyContent}</div>
        </div>
      </div>
    ` : ''}
  `;
}

function capitalizeWord(str) {
  if (!str) return '';
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function simpleMarkdown(md) {
  if (!md) return '';
  let h = md;
  h = h.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  h = h.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/^\s*-\s+(.+)$/gim, '<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)/g, m => '<ul>' + m + '</ul>');
  return h.split(/\n\n+/).map(b => {
    b = b.trim();
    if (!b) return '';
    if (b.startsWith('<h') || b.startsWith('<ul')) return b;
    return '<p>' + b.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
}

loadProduct();
</script>
